name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novabank_user
          POSTGRES_PASSWORD: unused-local-trust-auth
          POSTGRES_DB: novabank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novabank_user -d novabank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Load schema
        env:
          PGPASSWORD: unused-local-trust-auth
        run: psql -h localhost -U novabank_user -d novabank_test -f database/schema.sql
      - name: Run tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build and type check
        working-directory: frontend
        run: npm run build